<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand">
          <img src="cg5logo.jpeg" alt="CG-5 logo" />
        </div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="login-title">Sign in to your account</h1>
        <p class="subtitle">Enter your details below to continue.</p>

       <form id="login-form">
  <label for="email">Email address</label>
  <input id="email" name="email" type="text" placeholder="Enter your email" autocomplete="username" required />

  <div class="label-row">
    <label for="password">Password</label>
    <a href="#">Forgot password?</a>
  </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button class="show-password" type="button" aria-label="Show password">Show</button>
          </div>

          <label class="remember">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>

          <button class="submit-button" type="submit">Sign in <span>→</span></button>
          <p id="message" class="message" role="status"></p>
        </form>

        <p class="signup">Don't have an account? <a href="#">Create one</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
  </body>
</html>
